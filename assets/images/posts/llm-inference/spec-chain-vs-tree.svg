<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">链形与树形候选的结构对比</title>
<desc id="desc">链在每个位置保留一个候选，树保留多个候选分支；验证节点只能注意共同历史与自身祖先。图示的 top-1 与集合覆盖率采用贪心口径，不等同于随机采样接受率。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .on { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .edg { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>
<rect class="bg" width="1120" height="620" rx="20"/>
<text class="label" x="40" y="90">链：每层一个候选（贪心示意）</text><circle cx="90" cy="200" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text class="muted" x="90" y="242" text-anchor="middle">锚</text><path fill="none" stroke="#344054" stroke-width="2" d="M130 200 L153 200"/>
<path fill="#344054" d="M164 200 L151,206 L151,194 Z"/>
<circle cx="190" cy="200" r="16" fill="#ffedd5"/><text class="blk" x="190" y="242" text-anchor="middle">t1</text><path fill="none" stroke="#344054" stroke-width="2" d="M230 200 L253 200"/>
<path fill="#344054" d="M264 200 L251,206 L251,194 Z"/>
<circle cx="290" cy="200" r="16" fill="#ffedd5"/><text class="blk" x="290" y="242" text-anchor="middle">t2</text><path fill="none" stroke="#344054" stroke-width="2" d="M330 200 L353 200"/>
<path fill="#344054" d="M364 200 L351,206 L351,194 Z"/>
<circle cx="390" cy="200" r="16" fill="#ffedd5"/><text class="blk" x="390" y="242" text-anchor="middle">t3</text><path fill="none" stroke="#344054" stroke-width="2" d="M430 200 L453 200"/>
<path fill="#344054" d="M464 200 L451,206 L451,194 Z"/>
<circle cx="490" cy="200" r="16" fill="#ffedd5"/><text class="blk" x="490" y="242" text-anchor="middle">t4</text><text class="note" x="40" y="320">假设各层条件命中率相同，前缀概率按层连乘</text><text class="note" x="40" y="352">四层算例：α = 0.7 时 E ≈ 2.77</text><text class="label" x="580" y="90">树：每层保留多个候选</text><path fill="none" stroke="#94a3b8" stroke-width="2" d="M632 330 L710 230"/><path fill="none" stroke="#2563eb" stroke-width="5" d="M632 330 L710 430"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M736 230 L814 160"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M736 230 L814 285"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M736 430 L814 395"/><path fill="none" stroke="#2563eb" stroke-width="5" d="M736 430 L814 520"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 160 L918 130"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 160 L918 190"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 285 L918 255"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 285 L918 320"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 395 L918 370"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 395 L918 420"/><path fill="none" stroke="#94a3b8" stroke-width="2" d="M840 520 L918 470"/><path fill="none" stroke="#2563eb" stroke-width="5" d="M840 520 L918 545"/><circle cx="620" cy="330" r="11" fill="#2563eb"/><circle cx="724" cy="230" r="9" fill="#94a3b8"/><circle cx="724" cy="430" r="11" fill="#2563eb"/><circle cx="828" cy="160" r="9" fill="#94a3b8"/><circle cx="828" cy="285" r="9" fill="#94a3b8"/><circle cx="828" cy="395" r="9" fill="#94a3b8"/><circle cx="828" cy="520" r="11" fill="#2563eb"/><circle cx="932" cy="130" r="9" fill="#94a3b8"/><circle cx="932" cy="190" r="9" fill="#94a3b8"/><circle cx="932" cy="255" r="9" fill="#94a3b8"/><circle cx="932" cy="320" r="9" fill="#94a3b8"/><circle cx="932" cy="370" r="9" fill="#94a3b8"/><circle cx="932" cy="420" r="9" fill="#94a3b8"/><circle cx="932" cy="470" r="9" fill="#94a3b8"/><circle cx="932" cy="545" r="11" fill="#2563eb"/><text class="muted" x="952" y="550">祖先路径</text><text class="muted" x="610" y="580">加粗链即一个节点的祖先路径（树掩码）</text><text class="note" x="580" y="612">节点增加会改变验证成本；覆盖率需实测</text></svg>
