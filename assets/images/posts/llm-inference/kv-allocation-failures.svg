<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="400" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
  <title id="title">KV Cache 两种朴素管理方案的失败</title>
  <desc id="desc">上图：按最大长度连续预留，每路预留 8192 token，实际用量各不相同，斜纹部分永不写入却始终占着显存；下图：按需分配导致外部碎片，空闲总量足够但最大的连续空洞装不下新请求。</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .panel { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .lane { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .strip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .used { fill: #2563eb; }
    .free { fill: url(#hatch); stroke: #cbd5e1; stroke-width: 1.5; }
  </style>
  <defs>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#cbd5e1" stroke-width="2.5"/>
    </pattern>
  </defs>
  <rect class="bg" width="1120" height="400" rx="20"/>

  <text class="panel" x="150" y="52">按最大长度连续预留</text>
  <text class="lane" x="240" y="84" text-anchor="middle">请求1</text>
  <text class="lane" x="420" y="84" text-anchor="middle">请求2</text>
  <text class="lane" x="600" y="84" text-anchor="middle">请求3</text>
  <text class="lane" x="780" y="84" text-anchor="middle">请求4</text>
  <text class="lane" x="960" y="84" text-anchor="middle">请求5</text>
  <rect class="strip" x="150" y="94" width="180" height="56"/>
  <rect class="used" x="150" y="94" width="54" height="56"/>
  <rect class="free" x="204" y="94" width="126" height="56"/>
  <rect class="strip" x="330" y="94" width="180" height="56"/>
  <rect class="used" x="330" y="94" width="135" height="56"/>
  <rect class="free" x="465" y="94" width="45" height="56"/>
  <rect class="strip" x="510" y="94" width="180" height="56"/>
  <rect class="used" x="510" y="94" width="90" height="56"/>
  <rect class="free" x="600" y="94" width="90" height="56"/>
  <rect class="strip" x="690" y="94" width="180" height="56"/>
  <rect class="used" x="690" y="94" width="162" height="56"/>
  <rect class="free" x="852" y="94" width="18" height="56"/>
  <rect class="strip" x="870" y="94" width="180" height="56"/>
  <rect class="used" x="870" y="94" width="72" height="56"/>
  <rect class="free" x="942" y="94" width="108" height="56"/>
  <text class="note" x="150" y="190">每路预留 8192 token（1 GiB），实际用量各不相同——斜纹部分永不写入，却始终占着显存</text>

  <text class="panel" x="150" y="252">按需分配</text>
  <rect class="used" x="150" y="284" width="130" height="56"/>
  <rect class="free" x="280" y="284" width="55"  height="56"/>
  <rect class="used" x="335" y="284" width="210" height="56"/>
  <rect class="free" x="545" y="284" width="30"  height="56"/>
  <rect class="used" x="575" y="284" width="95"  height="56"/>
  <rect class="free" x="670" y="284" width="150" height="56"/>
  <rect class="used" x="820" y="284" width="185" height="56"/>
  <rect class="free" x="1005" y="284" width="75" height="56"/>
  <text class="note" x="150" y="380">长短不一的请求先后进出：空闲总量往往够，最大的连续空洞却装不下新请求——外部碎片</text>
</svg>
