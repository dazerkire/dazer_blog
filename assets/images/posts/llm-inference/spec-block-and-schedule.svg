<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">块级起草与验证裁剪：2026 年的两个方向</title>
<desc id="desc">左：DFlash 用小型块扩散模型一次并行前向产出整块候选，draft 成本对候选数近似平坦（示意：约 0.5 ms 出 16 个候选，串行方式约 5 ms）。右：DSpark 按估计的前缀存活概率裁剪验证长度，把验证从固定成本变成可调度量。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .on { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .edg { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>
<rect class="bg" width="1120" height="560" rx="20"/>
<text class="label" x="40" y="80">DFlash：一次并行前向出整块</text><rect x="60" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="89" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="118" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="147" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="176" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="205" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="234" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="263" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="292" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="321" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="350" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="379" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="408" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="437" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="466" y="130" width="26" height="26" rx="4" fill="#f97316"/><rect x="495" y="130" width="26" height="26" rx="4" fill="#f97316"/><text class="blk" x="60" y="190">块扩散：16 个候选（示意：3 层 draft，单步去噪）</text><rect x="60" y="240" width="30" height="30" rx="4" fill="#f97316"/><text class="blk" x="100" y="262">≈ 0.5 ms（并行）</text><rect x="60" y="300" width="300" height="30" rx="4" fill="#ffedd5" stroke="#f97316" stroke-width="2"/><text class="blk" x="370" y="322">≈ 5 ms（串行 16 步）</text><text class="note" x="40" y="390">draft 成本对候选数近似平坦</text><text class="note" x="40" y="420">实测 2.3–6.2x（EAGLE-3 同任务 1.9–2.5x）</text><text class="label" x="580" y="80">DSpark：按置信裁剪验证长度</text><rect x="600" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="629" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="658" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="687" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="716" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="745" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="774" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="803" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="832" y="150" width="26" height="26" rx="4" fill="#7c3aed"/><rect x="861" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="890" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="919" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="948" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="977" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="1006" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><rect x="1035" y="150" width="26" height="26" rx="4" fill="#ddd6fe"/><path fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" d="M858 130 V 200"/><text class="muted" x="858" y="120" text-anchor="middle">置信边界</text><text class="blk" x="730" y="205" text-anchor="middle">验证</text><text class="blk" x="970" y="205" text-anchor="middle">按存活概率裁掉</text><text class="note" x="580" y="290">半自回归起草：并行主干 + 轻量串行模块</text><text class="note" x="580" y="320">相对 MTP-1：同吞吐下每用户速度 +60–85%（线上）</text><text class="note" x="580" y="350">验证长度成为可调度量（第七篇展开）</text></svg>
