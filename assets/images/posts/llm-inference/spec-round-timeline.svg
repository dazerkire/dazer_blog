<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
<title id="title">普通 Decode 与投机解码一轮的时间轴对比</title>
<desc id="desc">普通路径 5 步各 3.2 ms 共 16 ms；投机路径 draft 4 步各 0.53 ms 加一次 3.2 ms 的验证前向共 5.34 ms，同样产出 5 个 token。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .small { fill: #64748b; font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .vlab { font: 700 21px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
<rect class="bg" width="1120" height="560" rx="20"/>
<text class="label" x="90" y="118">普通 Decode：一步一个 Token（B = 1）</text><rect x="90" y="150" width="179.2" height="68" rx="8" fill="#2563eb"/><rect x="279.2" y="150" width="179.2" height="68" rx="8" fill="#2563eb"/><rect x="468.4" y="150" width="179.2" height="68" rx="8" fill="#2563eb"/><rect x="657.6" y="150" width="179.2" height="68" rx="8" fill="#2563eb"/><rect x="846.8" y="150" width="179.2" height="68" rx="8" fill="#2563eb"/><text class="in" x="179.6" y="190" text-anchor="middle">3.2 ms</text><circle cx="179.6" cy="252" r="7" fill="#2563eb"/><text class="muted" x="179.6" y="282" text-anchor="middle">t1</text><circle cx="368.8" cy="252" r="7" fill="#2563eb"/><text class="muted" x="368.8" y="282" text-anchor="middle">t2</text><circle cx="558" cy="252" r="7" fill="#2563eb"/><text class="muted" x="558" y="282" text-anchor="middle">t3</text><circle cx="747.2" cy="252" r="7" fill="#2563eb"/><text class="muted" x="747.2" y="282" text-anchor="middle">t4</text><circle cx="936.4" cy="252" r="7" fill="#2563eb"/><text class="muted" x="936.4" y="282" text-anchor="middle">t5</text><text class="blk" x="1030" y="140" text-anchor="end">共 16 ms</text><text class="label" x="90" y="308">投机解码一轮（全接受）</text><rect x="90" y="330" width="29.68" height="68" rx="4" fill="#f97316"/><text class="in" x="104.84" y="370" text-anchor="middle">t1</text><rect x="127.68" y="330" width="29.68" height="68" rx="4" fill="#f97316"/><text class="in" x="142.52" y="370" text-anchor="middle">t2</text><rect x="165.36" y="330" width="29.68" height="68" rx="4" fill="#f97316"/><text class="in" x="180.2" y="370" text-anchor="middle">t3</text><rect x="203.04" y="330" width="29.68" height="68" rx="4" fill="#f97316"/><text class="in" x="217.88" y="370" text-anchor="middle">t4</text><rect x="246.72" y="330" width="179.2" height="68" rx="8" fill="#7c3aed"/><text class="in" x="336.32" y="370" text-anchor="middle">3.2 ms</text><text class="blk" x="161.36" y="426" text-anchor="middle">draft ×4 = 2.14 ms</text><text class="muted" x="161.36" y="448" text-anchor="middle">0.53 ms/步（1B）</text><text class="blk" x="336.32" y="426" text-anchor="middle">target 验证一次</text><text class="muted" x="336.32" y="448" text-anchor="middle">一次前向，5 个位置</text><text class="label" x="480" y="352">同样产出 5 个 Token</text><text class="vlab" fill="#344054" x="480" y="386">16 ms → 5.34 ms，上界 ≈ 3.0x</text><circle cx="262" cy="494" r="7" fill="#2563eb"/><text class="muted" x="262" y="524" text-anchor="middle">t1</text><circle cx="318" cy="494" r="7" fill="#2563eb"/><text class="muted" x="318" y="524" text-anchor="middle">t2</text><circle cx="374" cy="494" r="7" fill="#2563eb"/><text class="muted" x="374" y="524" text-anchor="middle">t3</text><circle cx="430" cy="494" r="7" fill="#2563eb"/><text class="muted" x="430" y="524" text-anchor="middle">t4</text><circle cx="486" cy="494" r="7" fill="#2563eb"/><text class="muted" x="486" y="524" text-anchor="middle">t5</text><text class="blk" x="556" y="501">产出 5 个 Token</text><text class="note" x="90" y="548">同一时间轴，H200 理想口径（η = 1）：target 8B 每步 15.3 GB → 3.2 ms；draft 1B 每步 2.57 GB → 0.53 ms；L = 2048。</text></svg>
