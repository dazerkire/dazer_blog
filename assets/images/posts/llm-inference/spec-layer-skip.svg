<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="510" viewBox="0 0 1120 510" role="img" aria-labelledby="title desc">
<title id="title">Draft &amp; Verify：选择性跳层</title><desc id="desc">Draft &amp; Verify 在起草路径中选择性跳过部分中间层，验证仍经过完整模型；这种选择性跳层不同于只运行前 M 层的提前退出。</desc>
<style>text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054;} .muted {fill:#64748b;} .edge {stroke:#64748b;stroke-width:2;fill:none;}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="1120" height="510" rx="20" fill="#fbfcfe"/>
<text x="40" y="48" font-size="25" text-anchor="start" class="">Draft &amp; Verify：选择性跳过部分层，验证仍运行完整模型</text>
<text x="40" y="84" font-size="18" text-anchor="start" class="muted">图中为整块示意；论文可分别选择 attention 与 MLP 层，不是固定前 M 层退出。</text>
<text x="40" y="142" font-size="21" text-anchor="start" class="">起草路径</text>
<rect x="60" y="170" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="112.5" y="206.0" font-size="20" text-anchor="middle" class="">层 1</text>
<path class="edge" d="M165 199 C215 110 285 110 340 199" marker-end="url(#arrow)"/><rect x="200" y="170" width="105" height="58" rx="9" fill="#f2f4f7" stroke="#98a2b3"/><text x="252.5" y="206.0" font-size="20" text-anchor="middle" class="">层 2</text>
<text x="252" y="253" font-size="18" text-anchor="middle" class="muted">跳过</text>
<rect x="340" y="170" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="392.5" y="206.0" font-size="20" text-anchor="middle" class="">层 3</text>
<path class="edge" d="M445 199 L480 199" marker-end="url(#arrow)"/>
<rect x="480" y="170" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="532.5" y="206.0" font-size="20" text-anchor="middle" class="">…</text>
<path class="edge" d="M585 199 C635 110 705 110 760 199" marker-end="url(#arrow)"/><rect x="620" y="170" width="105" height="58" rx="9" fill="#f2f4f7" stroke="#98a2b3"/><text x="672.5" y="206.0" font-size="20" text-anchor="middle" class="">层 31</text>
<text x="672" y="253" font-size="18" text-anchor="middle" class="muted">跳过</text>
<rect x="760" y="170" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="812.5" y="206.0" font-size="20" text-anchor="middle" class="">层 32</text>
<path class="edge" d="M865 199 L925 199" marker-end="url(#arrow)"/>
<rect x="925" y="170" width="145" height="58" rx="9" fill="#ddd6fe" stroke="#7c3aed"/><text x="997.5" y="206.0" font-size="20" text-anchor="middle" class="">LM Head</text>
<text x="40" y="297" font-size="21" text-anchor="start" class="">验证路径</text>
<rect x="60" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="112.5" y="361.0" font-size="20" text-anchor="middle" class="">层 1</text>
<path class="edge" d="M165 354 L200 354" marker-end="url(#arrow)"/>
<rect x="200" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="252.5" y="361.0" font-size="20" text-anchor="middle" class="">层 2</text>
<path class="edge" d="M305 354 L340 354" marker-end="url(#arrow)"/>
<rect x="340" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="392.5" y="361.0" font-size="20" text-anchor="middle" class="">层 3</text>
<path class="edge" d="M445 354 L480 354" marker-end="url(#arrow)"/>
<rect x="480" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="532.5" y="361.0" font-size="20" text-anchor="middle" class="">…</text>
<path class="edge" d="M585 354 L620 354" marker-end="url(#arrow)"/>
<rect x="620" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="672.5" y="361.0" font-size="20" text-anchor="middle" class="">层 31</text>
<path class="edge" d="M725 354 L760 354" marker-end="url(#arrow)"/>
<rect x="760" y="325" width="105" height="58" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="812.5" y="361.0" font-size="20" text-anchor="middle" class="">层 32</text>
<path class="edge" d="M865 354 L925 354" marker-end="url(#arrow)"/>
<rect x="925" y="325" width="145" height="58" rx="9" fill="#ddd6fe" stroke="#7c3aed"/><text x="997.5" y="361.0" font-size="20" text-anchor="middle" class="">LM Head</text>
<text x="40" y="461" font-size="20" text-anchor="start" class="">层集合由离线搜索选择；上方路径生成候选，下方完整前向执行验证。</text>
<text x="40" y="491" font-size="18" text-anchor="start" class="muted">LayerSkip 的提前退出属于另一种设计，需要与选择性跳层分开说明。</text>
</svg>
