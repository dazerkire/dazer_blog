<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="656" viewBox="0 0 1120 656" role="img" aria-labelledby="title desc">
<title id="title">两种负载下的端到端耗时对比</title>
<desc id="desc">对话（2048 输入 / 128 输出）与 RAG（32K 输入 / 200 输出）下 BF16、W4、FP8 的端到端理想耗时，每根柱由 Prefill（淡色）与 Decode（实色）叠成：对话中 W4 最快，RAG 中 FP8 最快。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .small { fill: #64748b; font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ptitle { fill: #344054; font: 600 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .seg { fill: #344054; font: 500 16px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tot { fill: #344054; font: 600 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .spdup { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
<rect class="bg" width="1120" height="656" rx="20"/>
<rect x="200" y="46" width="18" height="18" rx="4" fill="#2563eb"/><text class="small" x="226" y="62">BF16</text><rect x="310" y="46" width="18" height="18" rx="4" fill="#f97316"/><text class="small" x="336" y="62">W4</text><rect x="398" y="46" width="18" height="18" rx="4" fill="#7c3aed"/><text class="small" x="424" y="62">FP8</text><rect x="497" y="46" width="18" height="18" rx="4" fill="#dbeafe"/><rect x="506" y="46" width="9" height="18" fill="#2563eb"/><text class="small" x="523" y="62">每根柱 = Prefill（淡）+ Decode（实）</text><text class="ptitle" x="260" y="104" text-anchor="middle">对话：2048 输入 / 128 输出</text><line class="grid" x1="90" y1="510" x2="490" y2="510"/><text class="tick" x="78" y="516" text-anchor="end">0</text><line class="grid" x1="90" y1="429.565" x2="490" y2="429.565"/><text class="tick" x="78" y="435.565" text-anchor="end">100</text><line class="grid" x1="90" y1="349.13" x2="490" y2="349.13"/><text class="tick" x="78" y="355.13" text-anchor="end">200</text><line class="grid" x1="90" y1="268.696" x2="490" y2="268.696"/><text class="tick" x="78" y="274.696" text-anchor="end">300</text><line class="grid" x1="90" y1="188.261" x2="490" y2="188.261"/><text class="tick" x="78" y="194.261" text-anchor="end">400</text><line class="axis" x1="90" y1="510" x2="490" y2="510"/><line class="axis" x1="90" y1="510" x2="90" y2="128"/><text class="tick" x="84" y="148" text-anchor="end">ms</text><rect x="112" y="485.065" width="96" height="24.9348" fill="#dbeafe"/><rect x="112" y="158.5" width="96" height="326.565" fill="#2563eb"/><line x1="112" y1="485.065" x2="208" y2="485.065" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="160" y="146.5" text-anchor="middle">437 ms</text><text class="in" x="160" y="327.783" text-anchor="middle">406</text><text class="small" x="160" y="544" text-anchor="middle" fill="#344054">BF16</text><rect x="242" y="485.065" width="96" height="24.9348" fill="#ffedd5"/><rect x="242" y="399" width="96" height="86.0652" fill="#f97316"/><line x1="242" y1="485.065" x2="338" y2="485.065" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="290" y="387" text-anchor="middle">138 ms</text><text class="spdup" fill="#f97316" x="290" y="361" text-anchor="middle">×3.2</text><text class="in" x="290" y="448.033" text-anchor="middle">107</text><text class="small" x="290" y="544" text-anchor="middle" fill="#344054">W4</text><rect x="372" y="497.452" width="96" height="12.5478" fill="#ddd6fe"/><rect x="372" y="332.561" width="96" height="164.891" fill="#7c3aed"/><line x1="372" y1="497.452" x2="468" y2="497.452" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="420" y="320.561" text-anchor="middle">221 ms</text><text class="spdup" fill="#7c3aed" x="420" y="294.561" text-anchor="middle">×2.0</text><text class="in" x="420" y="421.007" text-anchor="middle">205</text><text class="small" x="420" y="544" text-anchor="middle" fill="#344054">FP8</text><text class="note" x="290" y="576" text-anchor="middle">Decode 占 93% —— W4 的主场</text><text class="ptitle" x="820" y="104" text-anchor="middle">RAG：32K 输入 / 200 输出</text><line class="grid" x1="650" y1="510" x2="1050" y2="510"/><text class="tick" x="638" y="516" text-anchor="end">0</text><line class="grid" x1="650" y1="412.632" x2="1050" y2="412.632"/><text class="tick" x="638" y="418.632" text-anchor="end">500</text><line class="grid" x1="650" y1="315.263" x2="1050" y2="315.263"/><text class="tick" x="638" y="321.263" text-anchor="end">1000</text><line class="grid" x1="650" y1="217.895" x2="1050" y2="217.895"/><text class="tick" x="638" y="223.895" text-anchor="end">1500</text><line class="axis" x1="650" y1="510" x2="1050" y2="510"/><line class="axis" x1="650" y1="510" x2="650" y2="128"/><text class="tick" x="644" y="148" text-anchor="end">ms</text><rect x="672" y="309.421" width="96" height="200.579" fill="#dbeafe"/><rect x="672" y="153.632" width="96" height="155.789" fill="#2563eb"/><line x1="672" y1="309.421" x2="768" y2="309.421" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="720" y="141.632" text-anchor="middle">1830 ms</text><text class="seg" x="720" y="415.711" text-anchor="middle">1030</text><text class="in" x="720" y="237.526" text-anchor="middle">800</text><text class="small" x="720" y="544" text-anchor="middle" fill="#344054">BF16</text><rect x="802" y="309.421" width="96" height="200.579" fill="#ffedd5"/><rect x="802" y="244.379" width="96" height="65.0421" fill="#f97316"/><line x1="802" y1="309.421" x2="898" y2="309.421" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="850" y="232.379" text-anchor="middle">1364 ms</text><text class="spdup" fill="#f97316" x="850" y="206.379" text-anchor="middle">×1.3</text><text class="seg" x="850" y="415.711" text-anchor="middle">1030</text><text class="small" x="850" y="544" text-anchor="middle" fill="#344054">W4</text><rect x="932" y="409.516" width="96" height="100.484" fill="#ddd6fe"/><rect x="932" y="314.289" width="96" height="95.2263" fill="#7c3aed"/><line x1="932" y1="409.516" x2="1028" y2="409.516" stroke="#fbfcfe" stroke-width="3"/><text class="tot" x="980" y="302.289" text-anchor="middle">1005 ms</text><text class="spdup" fill="#7c3aed" x="980" y="276.289" text-anchor="middle">×1.8</text><text class="seg" x="980" y="465.758" text-anchor="middle">516</text><text class="in" x="980" y="367.903" text-anchor="middle">489</text><text class="small" x="980" y="544" text-anchor="middle" fill="#344054">FP8</text><text class="note" x="850" y="576" text-anchor="middle">Prefill 占 56% —— FP8 的主场</text><text class="note" x="850" y="600" text-anchor="middle">两根 1030 一样高：同一片 Prefill，W4 压不动</text><text class="note" x="560" y="636" text-anchor="middle">理想口径（H200，Llama 3.1 8B）；两面板纵轴刻度不同；端到端 = Prefill + 输出 Token 数 × TPOT。</text></svg>
