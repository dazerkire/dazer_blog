<text x="40" y="235" font-size="18" text-anchor="start" class="">target 多层特征</text>
<text x="40" y="265" font-size="18" text-anchor="start" class="muted">注入 draft 各层 KV</text>
<path class="edge" d="M225 243 L325 243" marker-end="url(#arrow)"/>
<text x="50" y="394" font-size="20" text-anchor="start" class="">蓝：已经确定的 anchor　橙：本轮生成的 15 个新候选，随后交给 target 验证</text>
<text x="50" y="427" font-size="18" text-anchor="start" class="muted">增大块长仍会增加计算与临时状态；一次前向不意味着任意块长同样耗时。</text>
