<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="450" viewBox="0 0 1120 450" role="img" aria-labelledby="title desc">
<title id="title">DFlash：一个 anchor 与十五个新候选</title><desc id="desc">DFlash 的 block size 16 包含一个已知 anchor 与十五个待预测位置；小型块扩散 draft 一次并行前向生成十五个新候选，再由 target 验证。</desc>
