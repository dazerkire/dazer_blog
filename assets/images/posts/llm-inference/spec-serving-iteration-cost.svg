<title id="title">验证行开始计价的边界</title>
<desc id="desc">一次迭代的耗时随并发 B 的变化：字节项 3.125+0.0558B ms 与 FLOPs 项的交点即验证行开始按计算计价的位置。普通 Decode（1 行）的 FLOPs 项在任何 B 下都低于字节项；k=4 的验证（5 行）在 B*=122 处交叉；45 节点的树在 B 约 4.6 处即交叉。</desc>
