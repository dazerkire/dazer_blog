" y="226">k=2　1.8x</text><text class="label" x="555" y="554" text-anchor="middle">接受率 α（理想化：逐位置独立同分布）</text><text class="label" transform="rotate(-90)" x="-460" y="52">端到端加速比（相对普通 Decode）</text><text class="note" x="170" y="582">与 1x 的交点即临界 α：k=2 0.26，k=4 0.41，k=8 0.57（k 越大，盈亏平衡越晚）。</text><text class="note" x="170" y="606">T_round = k × 0.53 + 3.2 ms；E[N] = (1 − α^(k+1)) / (1 − α)；H200 理想口径；α 逐位置衰减时，大 k 的曲线偏乐观。</text></svg>
