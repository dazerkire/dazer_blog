<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">并发下的服务吞吐：各配置的曲线与渐近线</title>
<desc id="desc">吞吐随并发 B 的变化（理想口径）：普通 Decode 渐近 17.9k tok/s；外部 1B draft 的链形投机渐近 24.5k（1.37x，draft 与验证混合主导）；单层头链形渐近约 38k（2.1x，计算接管）；45 节点大树在 B 超过个位数后塌向约 5k，仅为普通的六成。</desc>
