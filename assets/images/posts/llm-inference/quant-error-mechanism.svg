<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc">
<title id="title">量化误差的两个来源</title>
<desc id="desc">上图：对称 INT4 量化中，误差上界是步长 a 的一半，极值零误差，落在两个码之间的中间值误差最大。下图：组内混入一个 +40 的 outlier 后，共享 scale 的码距撑大约 47 倍，其余 8 个权重全部落入码 0 的格、还原为 0。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .small { fill: #64748b; font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ptitle { fill: #344054; font: 600 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .code { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .wlab { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
<rect class="bg" width="1120" height="780" rx="20"/>
<text class="ptitle" x="80" y="76">① 对称 INT4：一组权重共用一个 scale（a = max|w| / 7 ≈ 0.121）</text><line class="axis" x1="110.0" y1="300.0" x2="1010.0" y2="300.0"/><line class="axis" x1="157.5" y1="300.0" x2="157.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="215" y1="300.0" x2="215" y2="312.0" stroke-width="1.6"/><line class="axis" x1="272.5" y1="300.0" x2="272.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="330" y1="300.0" x2="330" y2="312.0" stroke-width="1.6"/><line class="axis" x1="387.5" y1="300.0" x2="387.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="445" y1="300.0" x2="445" y2="312.0" stroke-width="1.6"/><line class="axis" x1="502.5" y1="300.0" x2="502.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="560" y1="300.0" x2="560" y2="312.0" stroke-width="1.6"/><line class="axis" x1="617.5" y1="300.0" x2="617.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="675" y1="300.0" x2="675" y2="312.0" stroke-width="1.6"/><line class="axis" x1="732.5" y1="300.0" x2="732.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="790" y1="300.0" x2="790" y2="312.0" stroke-width="1.6"/><line class="axis" x1="847.5" y1="300.0" x2="847.5" y2="312.0" stroke-width="1.6"/><line class="axis" x1="905" y1="300.0" x2="905" y2="312.0" stroke-width="1.6"/><line class="axis" x1="962.5" y1="300.0" x2="962.5" y2="312.0" stroke-width="1.6"/><text class="code" x="157.5" y="338.0" text-anchor="middle">−0.85</text><text class="code" x="560" y="338.0" text-anchor="middle">0</text><text class="code" x="962.5" y="338.0" text-anchor="middle">+0.85</text><path fill="none" stroke="#475569" stroke-width="1.8" d="M387.5 244 v-6 M387.5 242 h57.5 M445 244 v-6"/><text class="muted" x="416.25" y="228" text-anchor="middle">步长 a</text><circle cx="616.842" cy="270" r="7" fill="#2563eb"/><circle cx="157.368" cy="270" r="7" fill="#2563eb"/><circle cx="706.842" cy="270" r="7" fill="#2563eb"/><circle cx="569.474" cy="270" r="7" fill="#2563eb"/><circle cx="351.579" cy="270" r="7" fill="#2563eb"/><circle cx="877.368" cy="270" r="7" fill="#2563eb"/><circle cx="545.789" cy="270" r="7" fill="#2563eb"/><circle cx="834.737" cy="270" r="7" fill="#2563eb"/><text class="muted" x="110.0" y="252">权重 w（8 个）</text><circle cx="877.368" cy="270" r="7" fill="#2563eb" stroke="#f97316" stroke-width="3"/><text class="wlab" fill="#f97316" x="867.368" y="246" text-anchor="end">0.67</text><circle cx="905" cy="300.0" r="6" fill="none" stroke="#f97316" stroke-width="3"/><path fill="none" stroke="#f97316" stroke-width="2.5" d="M882.368 263 Q901 270 904 289"/><path fill="#f97316" d="M904 292 l-8 -7 l11 -3 z"/><path fill="none" stroke="#f97316" stroke-width="2" d="M877.368 322 v6 M877.368 328 h27.6316 M905 322 v6"/><text class="wlab" fill="#f97316" x="883.184" y="358" text-anchor="middle">+0.059 ≈ a/2</text><text class="note" x="110" y="392">极值（±0.85）零误差——a 按它定义；跌进两个码之间的中间值交税，误差上界始终是 a/2。</text><text class="ptitle" x="80" y="448">② 混入一个 outlier（+40）：码距撑大 47 倍，整组被劫持</text><line class="axis" x1="110.0" y1="505.0" x2="1010.0" y2="505.0"/><line class="axis" x1="-443.846" y1="505.0" x2="-443.846" y2="517.0" stroke-width="1.6"/><line class="axis" x1="-344.945" y1="505.0" x2="-344.945" y2="517.0" stroke-width="1.6"/><line class="axis" x1="-246.044" y1="505.0" x2="-246.044" y2="517.0" stroke-width="1.6"/><line class="axis" x1="-147.143" y1="505.0" x2="-147.143" y2="517.0" stroke-width="1.6"/><line class="axis" x1="-48.2418" y1="505.0" x2="-48.2418" y2="517.0" stroke-width="1.6"/><line class="axis" x1="50.6593" y1="505.0" x2="50.6593" y2="517.0" stroke-width="1.6"/><line class="axis" x1="149.56" y1="505.0" x2="149.56" y2="517.0" stroke-width="1.6"/><line class="axis" x1="248.462" y1="505.0" x2="248.462" y2="517.0" stroke-width="1.6"/><line class="axis" x1="347.363" y1="505.0" x2="347.363" y2="517.0" stroke-width="1.6"/><line class="axis" x1="446.264" y1="505.0" x2="446.264" y2="517.0" stroke-width="1.6"/><line class="axis" x1="545.165" y1="505.0" x2="545.165" y2="517.0" stroke-width="1.6"/><line class="axis" x1="644.066" y1="505.0" x2="644.066" y2="517.0" stroke-width="1.6"/><line class="axis" x1="742.967" y1="505.0" x2="742.967" y2="517.0" stroke-width="1.6"/><line class="axis" x1="841.868" y1="505.0" x2="841.868" y2="517.0" stroke-width="1.6"/><line class="axis" x1="940.769" y1="505.0" x2="940.769" y2="517.0" stroke-width="1.6"/><text class="code" x="-443.846" y="543.0" text-anchor="middle">−40</text><text class="code" x="248.462" y="543.0" text-anchor="middle">0</text><text class="code" x="940.769" y="543.0" text-anchor="middle">+40</text><rect x="199.011" y="496.0" width="98.9011" height="18" fill="#ffedd5"/><circle cx="250.538" cy="475" r="7" fill="#2563eb"/><circle cx="233.75" cy="475" r="7" fill="#2563eb"/><circle cx="253.827" cy="475" r="7" fill="#2563eb"/><circle cx="248.808" cy="475" r="7" fill="#2563eb"/><circle cx="240.846" cy="475" r="7" fill="#2563eb"/><circle cx="260.058" cy="475" r="7" fill="#2563eb"/><circle cx="247.942" cy="475" r="7" fill="#2563eb"/><circle cx="258.5" cy="475" r="7" fill="#2563eb"/><circle cx="940.769" cy="475" r="8" fill="#f97316"/><text class="wlab" fill="#f97316" x="956.769" y="481.0" text-anchor="start">+40</text><path fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" d="M233.75 515 L110.0 585 L1010.0 585 L260.058 515 Z"/><rect x="110.0" y="586" width="900" height="28" fill="#ffedd5"/><line class="axis" x1="110.0" y1="600" x2="1010.0" y2="600" stroke-width="1.6"/><circle cx="584.545" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="386.136" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="623.409" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="564.091" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="470" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="697.045" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="553.864" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><circle cx="678.636" cy="600" r="4" fill="#2563eb" stroke="#fbfcfe" stroke-width="1.5"/><text class="muted" x="560" y="575" text-anchor="middle">码 0 的格（宽 = a′ ≈ 5.71，两端已超出视野）</text><text class="note" x="560" y="652" text-anchor="middle">放大后：整段视野都在码 0 的格里 —— 8 个权重全部还原为 0</text><text class="note" x="110" y="716">救法：分组量化——每组用自己的 scale（group size 32–128），outlier 只劫持自己那一组。</text></svg>
