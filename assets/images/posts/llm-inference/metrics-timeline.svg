<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="560" viewBox="0 0 1120 560" role="img" aria-labelledby="title desc">
  <title id="title">一次请求的延迟指标时间轴</title>
  <desc id="desc">时间轴上依次是应用准备与排队、Prefill、逐 Token 生成；TTFT 覆盖从请求发出到首 Token 到达，ITL 是相邻 Token 的间隔，端到端延迟覆盖全程。</desc>
  <style>
    .bg { fill: #fbfcfe; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .bracket { stroke: #1d4ed8; stroke-width: 2.5; fill: none; }
    .bracket2 { stroke: #475569; stroke-width: 2.5; fill: none; }
    .block-text { fill: #ffffff; font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .hatch-text { fill: #475569; font: 600 19px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .em { fill: #1d4ed8; font: 600 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .label { fill: #344054; font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .small { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .green { fill: #15803d; font: 600 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
  <defs>
    <pattern id="hatch" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="9" height="9" fill="#f1f5f9"/>
      <line x1="0" y1="0" x2="0" y2="9" stroke="#cbd5e1" stroke-width="2.5"/>
    </pattern>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <path d="M0 0 L8 4 L0 8 z" fill="#15803d"/>
    </marker>
  </defs>
  <rect class="bg" width="1120" height="560" rx="20"/>

  <!-- TTFT bracket -->
  <text class="em" x="140" y="92">TTFT：请求发出 → 首 Token 到达</text>
  <path class="bracket" d="M140 128 v-12 h412 v12"/>
  <text class="small" x="1060" y="92" text-anchor="end">TPOT ≈ 各步 ITL 的平均</text>

  <!-- phase blocks -->
  <rect x="140" y="255" width="190" height="50" rx="6" fill="url(#hatch)" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="hatch-text" x="235" y="286" text-anchor="middle">应用准备 + 排队</text>
  <rect x="330" y="255" width="190" height="50" rx="6" fill="#2563eb"/>
  <text class="block-text" x="425" y="286" text-anchor="middle">Prefill</text>

  <!-- decode tokens -->
  <rect x="540" y="255" width="24" height="50" rx="4" fill="#16a34a"/>
  <rect x="640" y="255" width="24" height="50" rx="4" fill="#16a34a"/>
  <rect x="740" y="255" width="24" height="50" rx="4" fill="#16a34a"/>
  <text class="small" x="815" y="288">…</text>
  <rect x="948" y="255" width="24" height="50" rx="4" fill="#16a34a"/>
  <text class="green" x="762" y="222" text-anchor="middle">逐 Token 生成（Decode）</text>
  <line class="guide" x1="762" y1="232" x2="762" y2="250"/>

  <!-- main axis -->
  <line class="axis" x1="120" y1="330" x2="1060" y2="330"/>
  <path class="axis" d="M1060 330 l-14 -8 M1060 330 l-14 8" fill="none"/>
  <text class="label" x="1060" y="314" text-anchor="end">时间</text>

  <!-- axis annotations -->
  <line class="guide" x1="140" y1="305" x2="140" y2="330"/>
  <text class="small" x="140" y="362" text-anchor="middle">请求发出</text>
  <line class="guide" x1="552" y1="305" x2="552" y2="330"/>
  <text class="small" x="552" y="362" text-anchor="middle">首 Token</text>
  <line class="guide" x1="960" y1="305" x2="960" y2="330"/>
  <text class="small" x="960" y="362" text-anchor="middle">末 Token</text>

  <!-- ITL arrow -->
  <line x1="664" y1="402" x2="740" y2="402" stroke="#15803d" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text class="green" x="702" y="434" text-anchor="middle">ITL：相邻 Token 间隔</text>

  <!-- E2E bracket -->
  <path class="bracket2" d="M140 466 v12 h820 v-12"/>
  <text class="label" x="550" y="516" text-anchor="middle">端到端延迟：请求发出 → 完整响应接收完成</text>
</svg>
