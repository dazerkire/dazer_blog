<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="620" viewBox="0 0 1120 620" role="img" aria-labelledby="title desc">
<title id="title">量化加速比随并发 B 的变化</title>
<desc id="desc">Decode 每步时间相对 BF16 的加速比随并发 B（对数轴）变化：仅 W4 的加速比从 B=1 的约 3.8 倍衰减到 B=64 的约 1.5 倍并继续趋向 1；压缩 KV 的两条曲线趋向 2 倍渐近线。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 500 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .small { fill: #64748b; font: 500 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ptitle { fill: #344054; font: 600 24px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .asym { stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 8; }
    .vlab { font: 700 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
<rect class="bg" width="1120" height="620" rx="20"/>
<line class="grid" x1="150" y1="468.308" x2="990" y2="468.308"/><text class="tick" x="134" y="475.308" text-anchor="end">1x</text><line class="grid" x1="150" y1="351.385" x2="990" y2="351.385"/><text class="tick" x="134" y="358.385" text-anchor="end">2x</text><line class="grid" x1="150" y1="234.462" x2="990" y2="234.462"/><text class="tick" x="134" y="241.462" text-anchor="end">3x</text><line class="grid" x1="150" y1="117.538" x2="990" y2="117.538"/><text class="tick" x="134" y="124.538" text-anchor="end">4x</text><line class="grid" x1="160" y1="90" x2="160" y2="488"/><text class="tick" x="160" y="516" text-anchor="middle">1</text><line class="grid" x1="365" y1="90" x2="365" y2="488"/><text class="tick" x="365" y="516" text-anchor="middle">4</text><line class="grid" x1="570" y1="90" x2="570" y2="488"/><text class="tick" x="570" y="516" text-anchor="middle">16</text><line class="grid" x1="775" y1="90" x2="775" y2="488"/><text class="tick" x="775" y="516" text-anchor="middle">64</text><line class="grid" x1="980" y1="90" x2="980" y2="488"/><text class="tick" x="980" y="516" text-anchor="middle">256</text><line class="asym" x1="150" y1="351.385" x2="990" y2="351.385"/><text class="muted" x="200" y="339.385">渐近线 2x（KV 字节减半）</text><line class="axis" x1="150" y1="480" x2="1010" y2="480"/><path class="axis" d="M1010 480 l-14 -8 M1010 480 l-14 8"/><line class="axis" x1="150" y1="480" x2="150" y2="75"/><path class="axis" d="M150 75 l-8 14 M150 75 l8 14"/><line class="guide" x1="775" y1="100" x2="775" y2="480"/><text class="muted" x="783" y="106">B=64</text><polyline fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="160,140.935 262.5,161.405 365,195.52 467.5,245.134 570,304.662 672.5,361.591 775,405.377 877.5,433.741 980,450.129"/><text class="ser" fill="#2563eb" x="992" y="457.129">W4</text><polyline fill="none" stroke="#f97316" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="160,125.606 262.5,133.136 365,146.783 467.5,169.526 570,202.602 672.5,242.287 775,280.24 877.5,309.431 980,328.34"/><text class="ser" fill="#f97316" x="992" y="335.34">W4+KV</text><polyline fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" points="160,467.272 262.5,466.255 365,464.274 467.5,460.509 570,453.685 672.5,442.314 775,425.776 877.5,405.933 980,386.957"/><text class="ser" fill="#7c3aed" x="992" y="393.957">仅 KV</text><circle cx="160" cy="140.935" r="7" fill="#2563eb" stroke="#fbfcfe" stroke-width="2.5"/><circle cx="775" cy="405.377" r="7" fill="#2563eb" stroke="#fbfcfe" stroke-width="2.5"/><circle cx="160" cy="125.606" r="7" fill="#f97316" stroke="#fbfcfe" stroke-width="2.5"/><circle cx="775" cy="280.24" r="7" fill="#f97316" stroke="#fbfcfe" stroke-width="2.5"/><circle cx="160" cy="467.272" r="7" fill="#7c3aed" stroke="#fbfcfe" stroke-width="2.5"/><circle cx="775" cy="425.776" r="7" fill="#7c3aed" stroke="#fbfcfe" stroke-width="2.5"/><text class="vlab" fill="#2563eb" x="178" y="138.27">3.8x</text><text class="vlab" fill="#f97316" x="717" y="268.24">2.6x</text><text class="vlab" fill="#2563eb" x="717" y="393.377">1.5x</text><rect x="620" y="43" width="18" height="18" rx="4" fill="#2563eb"/><text class="small" x="646" y="58">W4（仅权重）</text><rect x="808" y="43" width="18" height="18" rx="4" fill="#f97316"/><text class="small" x="834" y="58">W4 + KV FP8</text><rect x="995" y="43" width="18" height="18" rx="4" fill="#7c3aed"/><text class="small" x="1021" y="58">仅 KV FP8</text><text class="label" x="570" y="552" text-anchor="middle">并发 B（对数刻度）</text><text class="label" transform="rotate(-90)" x="-460" y="52">Decode 每步提速（相对 BF16）</text><text class="note" x="160" y="600">理想口径：T(B) = (权重字节 + B × 每路 KV 字节) / 4.8 TB/s，L = 2048；KV FP8 即每路 128 MiB。</text></svg>
