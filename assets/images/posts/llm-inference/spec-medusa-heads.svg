<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">Medusa 的并行头</title>
<desc id="desc">Medusa：主干最后一层的隐状态 h 同时送入 LM Head 与多个附加头，一次前向产出 +1 真输出与 +2、+3 候选；后两个头在预测时看不到 +1 的实际取值，是并行盲猜。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .on { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  </style>
<rect class="bg" width="1120" height="430" rx="20"/>
<text class="label" x="60" y="70">Medusa：同一个 h 上的并行头</text><rect x="100" y="180" width="150" height="56" rx="8" fill="#2563eb"/>
<text class="in" x="175" y="214" text-anchor="middle">主干 32 层</text>
<path fill="none" stroke="#344054" stroke-width="2.5" d="M250 208 L299 208"/>
<path fill="#344054" d="M310 208 L297 214 L297 202 Z"/>
<circle cx="330" cy="208" r="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/><text class="on" x="330" y="215" text-anchor="middle">h</text><path fill="none" stroke="#2563eb" stroke-width="2.5" d="M350 198 L460.568 131.659"/>
<path fill="#2563eb" d="M470 126 L461.94 137.833 L455.766 127.543 Z"/>
<rect x="470" y="100" width="200" height="52" rx="8" fill="#2563eb"/>
<text class="in" x="570" y="132" text-anchor="middle">LM Head：+1 真输出</text>
<path fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 6" d="M350 208 L459 208"/>
<path fill="#f97316" d="M470 208 L457 214 L457 202 Z"/>
<rect x="470" y="182" width="200" height="52" rx="8" fill="#f97316"/>
<text class="in" x="570" y="214" text-anchor="middle">头 1：+2 候选</text>
<path fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 6" d="M350 218 L460.568 284.341"/>
<path fill="#f97316" d="M470 290 L455.766 288.457 L461.94 278.167 Z"/>
<rect x="470" y="264" width="200" height="52" rx="8" fill="#f97316"/>
<text class="in" x="570" y="296" text-anchor="middle">头 2：+3 候选</text>
<path fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 7" d="M700 176 V 316"/><text class="muted" x="716" y="230">预测 +2、+3 时，</text><text class="muted" x="716" y="258">前提（+1 的取值）</text><text class="muted" x="716" y="286">尚未产生</text><text class="note" x="100" y="384">draft 步时为 0；每头末层约 d×V：128k 词表两头 +2.17 GB，每步 3.2 → 3.64 ms（+14%）；32k 词表仅 +3.4%</text><text class="note" x="100" y="412">上限 E = 1 + 头数</text></svg>
