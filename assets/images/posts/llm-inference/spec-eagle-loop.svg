<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">特征条件串行起草</title><desc id="desc">EAGLE 类起草利用 target 特征和候选 token 的 embedding，逐步生成后续候选；图示为特征条件串行起草的简化结构，具体版本的模块和训练目标不同。</desc>
<style>text {font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;fill:#344054;} .muted {fill:#64748b;} .edge {stroke:#64748b;stroke-width:2;fill:none;}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="#64748b"/></marker></defs>
<rect width="1120" height="500" rx="20" fill="#fbfcfe"/>
<text x="40" y="48" font-size="25" text-anchor="start" class="">EAGLE 类：特征与候选 token 共同参与下一步起草</text>
<text x="40" y="85" font-size="18" text-anchor="start" class="muted">概念图：首步使用 target 特征，后续起草复用预测状态与已选候选信息。</text>
<rect x="55" y="155" width="250" height="65" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="180.0" y="194.5" font-size="21" text-anchor="middle" class="">target / 预测特征</text>
<rect x="400" y="155" width="220" height="65" rx="9" fill="#ffedd5" stroke="#f97316"/><text x="510.0" y="194.5" font-size="22" text-anchor="middle" class="">draft 模块</text>
<rect x="685" y="155" width="150" height="65" rx="9" fill="#ddd6fe" stroke="#7c3aed"/><text x="760.0" y="194.5" font-size="22" text-anchor="middle" class="">LM Head</text>
<rect x="900" y="155" width="160" height="65" rx="9" fill="#ffedd5" stroke="#f97316"/><text x="980.0" y="194.5" font-size="22" text-anchor="middle" class="">候选 t(i)</text>
<path class="edge" d="M305 187 L400 187" marker-end="url(#arrow)"/>
<path class="edge" d="M620 187 L685 187" marker-end="url(#arrow)"/>
<path class="edge" d="M835 187 L900 187" marker-end="url(#arrow)"/>
<rect x="865" y="305" width="220" height="60" rx="9" fill="#dbeafe" stroke="#2563eb"/><text x="975.0" y="342.0" font-size="20" text-anchor="middle" class="">token embedding</text>
<path class="edge" d="M980 220 L980 300" marker-end="url(#arrow)"/>
<path class="edge" d="M865 335 L510 335 L510 225" marker-end="url(#arrow)"/><text x="585" y="322" font-size="20" text-anchor="start" class="">反馈给下一步 draft</text>
<text x="40" y="423" font-size="20" text-anchor="start" class="">候选按步产生：t1 → t2 → t3 → t4；原始 EAGLE 与后续版本的特征及训练目标不同。</text>
<text x="40" y="465" font-size="18" text-anchor="start" class="muted">单层成本算例为 1.50 GB → 0.31 ms；这不是 EAGLE 或 MTP 的实测步时。</text>
</svg>
