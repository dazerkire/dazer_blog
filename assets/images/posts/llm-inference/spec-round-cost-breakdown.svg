<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">各方案一轮成本的构成与盈亏平衡</title>
<desc id="desc">六种候选来源在 k=4 下的一轮耗时构成：跳层 M=16 共 10.0 ms、跳层 M=8 共 7.04 ms、外部 1B 共 5.34 ms、EAGLE 与 MTP 共 4.44 ms、Medusa 两头每步 3.64 ms、n-gram 仅验证 3.2 ms；右侧标注盈亏平衡所需的每轮期望产出。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .on { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .edg { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>
<rect class="bg" width="1120" height="640" rx="20"/>
<rect x="170" y="58" width="18" height="18" rx="4" fill="#f97316"/><text class="muted" x="196" y="74">draft 步时（k=4）</text><rect x="370" y="58" width="18" height="18" rx="4" fill="#7c3aed"/><text class="muted" x="396" y="74">验证前向</text><rect x="520" y="58" width="18" height="18" rx="4" fill="#2563eb"/><text class="muted" x="546" y="74">每步附加头</text><text class="blk" x="178" y="158" text-anchor="end">跳层 M=16</text><rect x="190" y="130" width="462.4" height="44" rx="6" fill="#f97316"/><text class="in" x="642.4" y="158" text-anchor="end">6.8</text><rect x="652.4" y="130" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="860" y="158" text-anchor="end">3.2</text><text class="on" x="882" y="158">10.0 ms</text><text class="muted" x="965" y="158">E* = 3.13</text><text class="blk" x="178" y="226" text-anchor="end">跳层 M=8</text><rect x="190" y="198" width="261.12" height="44" rx="6" fill="#f97316"/><text class="in" x="441.12" y="226" text-anchor="end">3.84</text><rect x="451.12" y="198" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="658.72" y="226" text-anchor="end">3.2</text><text class="on" x="680.72" y="226">7.04 ms</text><text class="muted" x="965" y="226">E* = 2.20</text><text class="blk" x="178" y="294" text-anchor="end">外部 1B</text><rect x="190" y="266" width="145.52" height="44" rx="6" fill="#f97316"/><text class="in" x="325.52" y="294" text-anchor="end">2.14</text><rect x="335.52" y="266" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="543.12" y="294" text-anchor="end">3.2</text><text class="on" x="565.12" y="294">5.34 ms</text><text class="muted" x="965" y="294">E* = 1.67</text><text class="blk" x="178" y="362" text-anchor="end">EAGLE / MTP</text><rect x="190" y="334" width="84.32" height="44" rx="6" fill="#f97316"/><text class="in" x="264.32" y="362" text-anchor="end">1.24</text><rect x="274.32" y="334" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="481.92" y="362" text-anchor="end">3.2</text><text class="on" x="503.92" y="362">4.44 ms</text><text class="muted" x="965" y="362">E* = 1.39</text><text class="blk" x="178" y="430" text-anchor="end">Medusa（2 头）</text><rect x="190" y="402" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="397.6" y="430" text-anchor="end">3.2</text><rect x="407.6" y="402" width="29.92" height="44" rx="6" fill="#2563eb"/><text class="on" x="449.52" y="430">3.64 ms</text><text class="muted" x="965" y="430">E* = 1.14</text><text class="blk" x="178" y="498" text-anchor="end">n-gram</text><rect x="190" y="470" width="217.6" height="44" rx="6" fill="#7c3aed"/><text class="in" x="397.6" y="498" text-anchor="end">3.2</text><text class="on" x="419.6" y="498">3.20 ms</text><text class="muted" x="965" y="498">E* = 1.0</text><line class="guide" x1="407.6" y1="118" x2="407.6" y2="514"/><text class="muted" x="415.6" y="112">普通 Decode 一步 3.2 ms</text><line class="grid" x1="190" y1="118" x2="190" y2="514"/><text class="tick" x="190" y="536" text-anchor="middle">0</text><line class="grid" x1="326" y1="118" x2="326" y2="514"/><text class="tick" x="326" y="536" text-anchor="middle">2</text><line class="grid" x1="462" y1="118" x2="462" y2="514"/><text class="tick" x="462" y="536" text-anchor="middle">4</text><line class="grid" x1="598" y1="118" x2="598" y2="514"/><text class="tick" x="598" y="536" text-anchor="middle">6</text><line class="grid" x1="734" y1="118" x2="734" y2="514"/><text class="tick" x="734" y="536" text-anchor="middle">8</text><line class="grid" x1="870" y1="118" x2="870" y2="514"/><text class="tick" x="870" y="536" text-anchor="middle">10</text><text class="tick" x="530" y="564" text-anchor="middle">一轮耗时（ms，理想口径 η = 1，H200）</text><text class="muted" x="1000" y="112" text-anchor="middle">盈亏平衡</text></svg>
