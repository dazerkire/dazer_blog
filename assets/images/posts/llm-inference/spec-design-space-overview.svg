<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="title desc">
<title id="title">投机解码设计空间：四类候选来源</title>
<desc id="desc">四类候选来源的推理时结构：外部小模型（串行起草后一次验证）、模型自身跳层（前 M 层加 LM Head 早期退出）、Medusa 附加头（同一个 h 并行出多个未来位置的候选）、EAGLE 与 MTP 特征层头（一层 draft 模块串行推进，复用 LM Head）。</desc>
<style>
    .bg { fill: #fbfcfe; }
    .grid { stroke: #dce3ea; stroke-width: 1; stroke-dasharray: 5 8; }
    .axis { stroke: #344054; stroke-width: 2.5; }
    .guide { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 5 7; }
    .label { fill: #344054; font: 600 22px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .tick { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .muted { fill: #64748b; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .note { fill: #475569; font: 500 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .in { fill: #ffffff; font: 600 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .blk { fill: #64748b; font: 500 17px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .on { fill: #344054; font: 600 18px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .ser { font: 700 20px -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
    .edg { stroke: #94a3b8; stroke-width: 2; fill: none; }
  </style>
<rect class="bg" width="1120" height="640" rx="20"/>
<text class="label" x="40" y="100">① 外部小模型（第五篇基线）</text><rect x="60" y="130" width="170" height="56" rx="8" fill="#f97316"/>
<text class="in" x="145" y="164" text-anchor="middle">draft 1B</text>
<text class="blk" x="145" y="212" text-anchor="middle">串行 4 步 × 0.53 ms</text><path fill="none" stroke="#344054" stroke-width="2.5" d="M230 158 L289 158"/>
<path fill="#344054" d="M300 158 L287,164 L287,152 Z"/>
<rect x="300" y="130" width="180" height="56" rx="8" fill="#7c3aed"/>
<text class="in" x="390" y="164" text-anchor="middle">target 8B 验证</text>
<text class="blk" x="390" y="212" text-anchor="middle">一次前向 3.2 ms</text><text class="note" x="60" y="300">额外 2.5 GB 显存；临界 α ≈ 0.41</text><text class="label" x="580" y="100">② 模型自身：跳层起草</text><rect x="640" y="125" width="84" height="130" rx="8" fill="#dbeafe"/><line x1="646" y1="147" x2="718" y2="147" stroke="#dce3ea" stroke-width="2"/><line x1="646" y1="169" x2="718" y2="169" stroke="#dce3ea" stroke-width="2"/><line x1="646" y1="191" x2="718" y2="191" stroke="#dce3ea" stroke-width="2"/><line x1="646" y1="213" x2="718" y2="213" stroke="#dce3ea" stroke-width="2"/><line x1="646" y1="235" x2="718" y2="235" stroke="#dce3ea" stroke-width="2"/><rect x="640" y="234" width="84" height="21" rx="6" fill="#ffedd5"/><text class="blk" x="628" y="196" text-anchor="end">32 层主干</text><text class="muted" x="628" y="248" text-anchor="end">前 M 层</text><path fill="none" stroke="#f97316" stroke-width="2.5" d="M724 245 L777 245"/>
<path fill="#f97316" d="M788 245 L775,251 L775,239 Z"/>
<rect x="788" y="218" width="168" height="52" rx="8" fill="#ffedd5"/>
<text class="on" x="872" y="250" text-anchor="middle">LM Head → 候选链</text>
<path fill="none" stroke="#7c3aed" stroke-width="2.5" d="M724 140 L777 140"/>
<path fill="#7c3aed" d="M788 140 L775,146 L775,134 Z"/>
