<text class="note" x="580" y="300">0 显存 0 维护；M=8 每步 0.96 ms</text><text class="label" x="40" y="380">③ 附加头：Medusa</text><rect x="60" y="430" width="150" height="56" rx="8" fill="#2563eb"/>
