<path fill="none" stroke="#f97316" stroke-width="2.5" stroke-dasharray="6 6" d="M291 468 L322.916 489.796"/>
<path fill="#f97316" d="M332 496 L317.881,493.623 L324.648,483.714 Z"/>
<rect x="332" y="472" width="118" height="48" rx="8" fill="#f97316"/>
<text class="in" x="391" y="502" text-anchor="middle">头 2：+3</text>
<text class="muted" x="462" y="480">未见过前驱</text><text class="note" x="60" y="580">draft 步时 0；每步开销随词表增长（2 头约 +14%）</text><text class="note" x="580" y="580">每步 0.31 ms；额外 1.5 GB；MTP 为训练内置</text><text class="label" x="580" y="380">④ 特征层头：EAGLE / MTP</text><rect x="600" y="430" width="140" height="56" rx="8" fill="#2563eb"/>
